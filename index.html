<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions Tournament</title>
  <style>
    :root { --azul-arena: #0a2e5c; --azul-neon: #00bfff; --amarelo-campeao: #ffde00; --fundo-escuro: #060e18; --cinza-card: rgba(13, 27, 42, 0.9); }
    body { background-color: var(--fundo-escuro); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background-image: radial-gradient(circle, var(--azul-arena) 0%, var(--fundo-escuro) 85%); min-height: 100vh; padding: 15px; box-sizing: border-box; }
    .container { width: 95%; max-width: 450px; margin: 30px auto; padding: 25px; border: 2px solid var(--azul-neon); border-radius: 15px; background: rgba(6, 14, 24, 0.95); text-align: center; box-sizing: border-box; }
    #main-screen.container { max-width: 600px; }
    h1 { color: var(--azul-neon); text-transform: uppercase; font-size: 1.4rem; } 
    .input-group { margin: 15px 0; text-align: left; } 
    label { display: block; color: #e5e9f0; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; } 
    input, textarea { width: 100%; padding: 12px; background: #132237; border: 1px solid var(--azul-arena); color: white; border-radius: 5px; box-sizing: border-box; } 
    .btn-sub { width: 100%; padding: 14px; font-size: 0.75rem; font-weight: bold; color: white; border-radius: 5px; cursor: pointer; border: 1px solid var(--azul-neon); background: linear-gradient(to bottom, #00bfff, #0a2e5c); text-transform: uppercase; }
    .fase-secao { text-align: left; margin-top: 25px; }
    .fase-header { color: var(--amarelo-campeao); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid rgba(0, 191, 255, 0.2); padding-bottom: 6px; margin-bottom: 10px; }
    .card-duelo { background: var(--cinza-card); border: 1px solid var(--azul-arena); border-left: 4px solid var(--azul-neon); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .linha-treinador { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; }
    .linha-treinador.winner { color: var(--amarelo-campeao); font-weight: bold; }
    .btn-vitoria { background: #00cc88; border: none; color: white; padding: 4px 8px; font-size: 0.65rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .urna-box { background: rgba(2, 8, 19, 0.8); border: 2px solid var(--amarelo-campeao); padding: 20px; border-radius: 10px; margin-top: 15px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- TELA 1: ENTRADA MANUAL DE JOGADORES -->
  <div id="auth-screen" class="container">
    <h1>Inscrição Rápida da Liga</h1>
    <p style="color: #88c0d0; font-size: 0.8rem;">Cole os nicks e links do Showdown abaixo (Um por linha):</p>
    <div class="input-group">
      <label>Formato: Nome do Jogador, Link do Time</label>
      <textarea id="lista-jogadores-input" rows="10" placeholder="Ash, https://pokepaste...&#10;Gary, https://pokepaste...&#10;Red, https://pokepaste..."></textarea>
    </div>
    <button onclick="gerarChaveamentoIndependente()" class="btn-sub">⚔️ Criar Torneio Oficial</button>
  </div>
  <!-- TELA 2: ÁRVORE MATA-MATA -->
  <div id="main-screen" class="container hidden">
    <h1>Chaves Oficiais da Liga</h1>
    <div id="container-fases-arvore"></div>
    <button onclick="location.reload()" style="color:#64748b; background:none; border:none; margin-top:25px; cursor:pointer; font-weight:bold; text-transform:uppercase; font-size:0.7rem;">Reiniciar Sistema</button>
  </div>

<script>
let competidoresLocais = [];
let confrontosAtivos = [];

function formatarColunaTimeComLink(textoTime) {
  if (!textoTime || textoTime.trim() === "") return "";
  var link = textoTime.toString().trim();
  if (link.startsWith("http://") || link.startsWith("https://") || link.includes("pokepaste") || link.includes("showdown")) {
    return `<a href="${link}" target="_blank" rel="noopener noreferrer" style="display:inline-block; background:linear-gradient(to bottom, #00bfff, #0a2e5c); color:white; text-decoration:none; padding:3px 6px; font-size:0.6rem; font-weight:bold; border-radius:3px; text-transform:uppercase; border:1px solid #00bfff; margin-left:6px;">📋 Lista</a>`;
  }
  return "";
}

function generarChaveamentoIndependente() {
  var texto = document.getElementById("lista-jogadores-input").value.trim();
  if (!texto) { alert("Digite ao menos 2 jogadores!"); return; }

  // Separa as linhas digitadas
  var linhas = texto.split("\n");
  competidoresLocais = [];

  linhas.forEach(linha => {
    if (linha.trim() !== "") {
      var partes = linha.split(",");
      var nome = partes[0] ? partes[0].trim() : "Treinador";
      var link = partes[1] ? partes[1].trim() : "";
      competidoresLocais.push({ nome: nome, time: link });
    }
  });

  if (competidoresLocais.length < 2) { alert("Quantidade insuficiente de competidores!"); return; }

  // Embaralha os jogadores locais
  for (let i = competidoresLocais.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    let temp = competidoresLocais[i]; competidoresLocais[i] = competidoresLocais[j]; competidoresLocais[j] = temp;
  }

  let n = competidoresLocais.length;
  let potencia = 2;
  while (potencia < n) potencia *= 2;

  let byesCount = potencia - n;
  let reaisCount = n - byesCount;
  let partidasCount = reaisCount / 2;

  let jogamR1 = competidoresLocais.slice(0, reaisCount);
  let ganhamBye = competidoresLocais.slice(reaisCount);

  confrontosAtivos = [];
  let nomeFase1 = "Rodada Inicial";
  if (potencia === 32) nomeFase1 = "Preliminar (32)";
  else if (potencia === 16) nomeFase1 = "Oitavas de Final";
  else if (potencia === 8) nomeFase1 = "Quartas de Final";

  // Partidas reais da Rodada 1
  for (let m = 0; m < partidasCount; m++) {
    confrontosAtivos.push({ id: "F1-M" + (m + 1), fase: nomeFase1, j1: jogamR1[m * 2].nome, j2: jogamR1[(m * 2) + 1].nome, vencedor: "" });
  }
  // Isenções (BYEs) da Rodada 1
  for (let b = 0; b < ganhamBye.length; b++) {
    confrontosAtivos.push({ id: "F1-B" + (b + 1), fase: nomeFase1, j1: ganhamBye[b].nome, j2: "BYE", vencedor: ganhamBye[b].nome });
  }

  // Gera as fases seguintes vazias dividindo por 2 rigidamente
  let vagasFaseSeguinte = potencia / 2;
  let numeroFaseContador = 2;

  while (vagasFaseSeguinte >= 1) {
    let nomeFaseLabel = "Fase " + numeroFaseContador;
    if (vagasFaseSeguinte === 16) nomeFaseLabel = "Oitavas de Final";
    if (vagasFaseSeguinte === 8) nomeFaseLabel = "Quartas de Final";
    if (vagasFaseSeguinte === 4) nomeFaseLabel = "Quartas de Final";
    if (vagasFaseSeguinte === 2) nomeFaseLabel = "Semifinal";
    if (vagasFaseSeguinte === 1) nomeFaseLabel = "Grande Final";

    for (let x = 0; x < vagasFaseSeguinte; x++) {
      confrontosAtivos.push({ id: "F" + numeroFaseContador + "-M" + (x + 1), fase: nomeFaseLabel, j1: "Aguardando...", j2: "Aguardando...", vencedor: "" });
    }
    vagasFaseSeguinte = vagasFaseSeguinte / 2;
    numeroFaseContador++;
  }

  document.getElementById("auth-screen").classList.add("hidden");
  document.getElementById("main-screen").classList.remove("hidden");

  // Avança automaticamente quem ganhou BYE para a Fase 2
  ganhamBye.forEach((jogador, b) => {
    avançarJogadorLocal("F1-B" + (b + 1), jogador.nome);
  });

  renderizarArvoreLocal();
}
function avançarJogadorLocal(idDuelo, nomeVencedor) {
  if (!idDuelo || !nomeVencedor) return;
  var numeros = idDuelo.match(/\d+/g);
  if (!numeros || numeros.length < 2) return;

  var faseAtual = parseInt(numeros[0]);
  var numeroMatch = parseInt(numeros[1]);
  if (isNaN(faseAtual) || isNaN(numeroMatch)) return;

  var proximaFase = faseAtual + 1;
  var proximoMatchIndex = Math.ceil(numeroMatch / 2);
  var ehSlot1 = (numeroMatch % 2 !== 0);
  var idAlvo = "F" + proximaFase + "-M" + proximoMatchIndex;

  confrontosAtivos.forEach(match => {
    if (match.id === idAlvo) {
      if (ehSlot1) { match.j1 = nomeVencedor; } 
      else { match.j2 = nomeVencedor; }
      
      if (match.j1 === "BYE" || match.j2 === "BYE") {
        var proxVencedor = match.j1 === "BYE" ? match.j2 : match.j1;
        if (proxVencedor !== "Aguardando...") {
          match.vencedor = proxVencedor;
          avançarJogadorLocal(idAlvo, proxVencedor);
        }
      }
    }
  });
}

function marcarVitoria(idDuelo, nomeVencedor) {
  if (confirm("Confirma a vitória de " + nomeVencedor + "?")) {
    confrontosAtivos.forEach(match => {
      if (match.id === idDuelo) {
        match.vencedor = nomeVencedor;
        avançarJogadorLocal(idDuelo, nomeVencedor);
      }
    });
    renderizarArvoreLocal();
  }
}

function renderizarArvoreLocal() {
  var container = document.getElementById('container-fases-arvore');
  if (!container) return;
  container.innerHTML = "";

  var nomeCampeaoSupremo = "";
  var ultimoMatch = confrontosAtivos[confrontosAtivos.length - 1];
  if (ultimoMatch && ultimoMatch.fase === "Grande Final" && ultimoMatch.vencedor) {
    nomeCampeaoSupremo = ultimoMatch.vencedor;
  }

  var html = "";
  if (nomeCampeaoSupremo !== "" && nomeCampeaoSupremo !== "BYE") {
    html += `
      <div class="urna-box" style="margin-bottom:30px; animation:pulse 2s infinite;">
        <div style="font-size:1.8rem;">👑🏆👑</div>
        <div style="font-size:0.85rem; color:var(--amarelo-campeao); font-weight:bold; text-transform:uppercase; letter-spacing:2px; margin-top:5px;">Grande Campeão da Liga</div>
        <div style="font-size:2rem; color:#fff; font-weight:900; text-shadow:0 0 20px var(--amarelo-campeao); margin:10px 0;">${nomeCampeaoSupremo}</div>
      </div>`;
  }

  var agrupamento = {};
  confrontosAtivos.forEach(m => {
    if (m && m.fase) {
      if (!agrupamento[m.fase]) agrupamento[m.fase] = [];
      agrupamento[m.fase].push(m);
    }
  });

  for (var fase in agrupamento) {
    var contemPartidaValida = agrupamento[fase].some(m => m.j1 !== "BYE" && m.j2 !== "BYE");
    if (!contemPartidaValida) continue;

    html += `<div class="fase-secao"><div class="fase-header">${fase}</div>`;
    agrupamento[fase].forEach(match => {
      if (match.j1 === "BYE" || match.j2 === "BYE") return;

      var isW1 = match.vencedor && match.vencedor === match.j1;
      var isW2 = match.vencedor && match.vencedor === match.j2;
      var pronto = match.j1 !== "Aguardando..." && match.j2 !== "Aguardando...";

      // Resgata o link do time na lista de competidores locais
      var jogador1Obj = competidoresLocais.find(c => c.nome === match.j1);
      var jogador2Obj = competidoresLocais.find(c => c.nome === match.j2);
      var linkT1 = jogador1Obj ? jogador1Obj.time : "";
      var linkT2 = jogador2Obj ? jogador2Obj.time : "";

      html += `
        <div class="card-duelo" style="margin-bottom: 15px; text-align: left;">
          <div class="linha-treinador ${isW1 ? 'winner' : ''}">
            <span style="display:flex; align-items:center;">🏃 ${match.j1} ${isW1 ? '🏆' : ''} ${formatarColunaTimeComLink(linkT1)}</span>
            ${(pronto && !match.vencedor) ? `<button onclick="marcarVitoria('${match.id}', '${match.j1}')" class="btn-vitoria">Venceu</button>` : ""}
          </div>
          <div class="linha-treinador ${isW2 ? 'winner' : ''}" style="margin-top:8px;">
            <span style="display:flex; align-items:center;">🏃 ${match.j2} ${isW2 ? '🏆' : ''} ${formatarColunaTimeComLink(linkT2)}</span>
            ${(pronto && !match.vencedor) ? `<button onclick="marcarVitoria('${match.id}', '${match.j2}')" class="btn-vitoria">Venceu</button>` : ""}
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}
</script>
</body>
</html>
