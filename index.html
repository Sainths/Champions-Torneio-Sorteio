<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions Tournament - Bracket & Draw</title>
  <style>
    :root {
      --azul-arena: #0a2e5c;
      --azul-neon: #00bfff;
      --vermelho-liga: #ff1f1f;
      --amarelo-campeao: #ffde00;
      --fundo-escuro: #060e18;
      --cinza-card: rgba(13, 27, 42, 0.9);
    }

    body {
      background-color: var(--fundo-escuro);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: radial-gradient(circle, var(--azul-arena) 0%, var(--fundo-escuro) 85%);
      min-height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }

    .container { 
      width: 95%; 
      max-width: 450px; 
      margin: 30px auto; 
      padding: 25px; 
      border: 2px solid var(--azul-neon); 
      border-radius: 15px; 
      background: rgba(6, 14, 24, 0.95); 
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.4); 
      text-align: center; 
      box-sizing: border-box; 
    }

    #main-screen.container { max-width: 600px; }
    h1 { color: var(--azul-neon); text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px #000, 0 0 10px rgba(0, 191, 255, 0.6); font-size: 1.4rem; margin-top: 5px; } 
    .tab-buttons { display: flex; background: var(--azul-arena); border-radius: 8px; overflow: hidden; margin-bottom: 25px; border: 1px solid var(--azul-neon); } 
    
    .tab-btn { flex: 1; background: transparent; border: none; color: #aebac7; padding: 14px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; }
    .tab-btn.active { background: var(--azul-neon); color: white; text-shadow: 1px 1px 2px black; }

    .input-group { margin: 15px 0; text-align: left; } 
    label { display: block; color: #e5e9f0; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; } 
    input { width: 100%; padding: 12px; background: #132237; border: 1px solid var(--azul-arena); color: white; border-radius: 5px; box-sizing: border-box; font-size: 0.9rem; } 
    input:focus { border-color: var(--azul-neon); box-shadow: 0 0 8px rgba(0, 191, 255, 0.5); outline: none; } 
    
    .btn-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .btn-sub { padding: 14px; font-size: 0.75rem; font-weight: bold; color: white; border-radius: 5px; cursor: pointer; text-transform: uppercase; text-shadow: 1px 1px 2px black; border: 1px solid var(--azul-neon); }
    
    .fase-secao { text-align: left; margin-top: 25px; }
    .fase-header { color: var(--amarelo-campeao); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid rgba(0, 191, 255, 0.2); padding-bottom: 6px; margin-bottom: 10px; }
    
    .card-duelo { background: var(--cinza-card); border: 1px solid var(--azul-arena); border-left: 4px solid var(--azul-neon); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .duelistas-nomes { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
    .linha-treinador { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
    .linha-treinador.winner { color: var(--amarelo-campeao); font-weight: bold; }
    
    .btn-vitoria { background: #00cc88; border: none; color: white; padding: 6px 10px; font-size: 0.65rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .urna-box { background: rgba(2, 8, 19, 0.8); border: 2px dashed var(--azul-neon); padding: 20px; border-radius: 10px; margin-top: 15px; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 15px; font-size: 0.85rem; color: var(--amarelo-campeao); font-weight: bold; }
  </style>
</head>
<body>
  <!-- TELA 1: AUTENTICAÇÃO E LOGIN SEGURO DA LIGA -->
  <div id="auth-screen" class="container">
    <img src="icone-sorteio.png" alt="Logo" style="width: 85px; height: 85px; border-radius: 50%; border: 2px solid var(--azul-neon); margin-bottom: 12px; background-color: var(--fundo-escuro); object-fit: cover;">
    <h1>Champions Tournament</h1>
    <p style="color: #88c0d0; font-size: 0.8rem; margin-bottom: 20px;">Portal de Chaves Sincronizadas da Liga:</p>
    
    <div class="input-group">
      <label>Nome do Treinador</label>
      <input type="text" id="nome" placeholder="Ex: Ash">
    </div>
    <div class="input-group">
      <label>Senha de Acesso</label>
      <input type="password" id="senha" placeholder="****">
    </div>
    <div class="input-group">
      <label>Seu Time (Link do Showdown / Pokepaste)</label>
      <input type="text" id="deck-torneio" placeholder="Cole o link da sua Team Sheet aqui...">
    </div>
    
    <div class="btn-duo">
      <button onclick="registrarInscricao('torneio')" class="btn-sub" style="background: linear-gradient(to bottom, #00bfff, #0a2e5c);">⚔️ VGC Torneio</button>
      <button onclick="registrarInscricao('sorteio')" class="btn-sub" style="background: linear-gradient(to bottom, var(--amarelo-campeao), #b89200); color: black; font-weight: bold;">🎁 Urna Sorteio</button>
    </div>
    <p id="status-login" class="status-msg"></p>
  </div>

  <!-- TELA 2: DASHBOARD CENTRAL COM SELEÇÃO DE ABAS -->
  <div id="main-screen" class="container hidden">
    <p style="text-align: left; font-size: 0.85rem; margin-bottom: 15px; color: #88c0d0;">Treinador Ativo: <span id="user-display" style="color:var(--amarelo-campeao); font-weight: bold;">---</span></p>
    
    <div class="tab-buttons">
      <button class="tab-btn active" id="btn-aba-chaves" onclick="trocarAbaVisual('aba-chaveamento')">Chaves Mata-Mata</button>
      <button class="tab-btn" id="btn-aba-premios" onclick="trocarAbaVisual('aba-premios')">Urna de Brindes</button>
    </div>

    <!-- RECURSOS DO ORGANIZADOR DA LIGA (EXCLUSIVO ADMIN) -->
    <div id="painel-admin" class="hidden" style="margin-bottom: 25px; padding: 15px; border: 1px dashed var(--vermelho-liga); border-radius: 10px; background: rgba(255, 31, 31, 0.03); text-align: left;">
      <h3 style="color: var(--vermelho-liga); font-size: 0.85rem; margin: 0 0 12px 0; text-transform: uppercase;">⚙️ PAINEL DO ORGANIZADOR</h3>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px;">
        <button onclick="gerarChaveamentoLocal()" style="background: #00cc88; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">Embaralhar & Iniciar</button>
        <button onclick="resetarTorneioLocal()" style="background: var(--vermelho-liga); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">Resetar Torneio</button>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
        <label style="font-size: 0.7rem; color: #aebac7;">Item Cadastrado:</label>
        <input type="text" id="input-nome-premio" placeholder="Ex: Booster Pack Pokémon..." style="padding: 8px; font-size: 0.8rem; margin-bottom: 8px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button onclick="publicarPremioSemSortear()" style="background: var(--azul-neon); color: black; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">📢 Anunciar Prêmio</button>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button onclick="dispararSorteioBrinde()" style="background: var(--amarelo-campeao); color: black; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">🎰 Rolar Sorteio</button>
            <button onclick="resetarDadosMaster('sorteio')" style="background: #4b5d6c; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.7rem; text-transform: uppercase;">Limpar Urna</button>
          </div>
        </div>
      </div>
    </div>

    <!-- AREA VISUAL DE EXIBIÇÃO DA ÁRVORE -->
    <div id="aba-chaveamento" class="tab-content">
      <div id="container-fases-arvore">
        <p style="color:#64748b; font-size:0.8rem; padding: 20px;">Aguardando geração de chaves oficiais...</p>
      </div>
    </div>

    <!-- AREA VISUAL DA URNA DE PRÊMIOS -->
    <div id="aba-premios" class="tab-content hidden">
      <div class="urna-box">
        <div style="font-size: 1.1rem; color: var(--amarelo-campeao); font-weight: bold;">🎁 ITEM DA RODADA:</div>
        <div id="display-brinde-alvo" style="color: var(--azul-neon); font-size: 1.1rem; font-weight: bold;">Nenhum item em disputa</div>
        <hr style="border: 0; border-top: 1px solid rgba(0,191,255,0.1); margin: 15px 0;">
        <div style="font-size: 0.75rem; color: #88c0d0; text-transform: uppercase; letter-spacing: 0.5px;">🏆 Vencedor do Sorteio Eletrônico 🏆</div>
        <div id="display-ganhador-sorteio" style="font-size: 1.6rem; color: #fff; font-weight: 900; text-shadow: 0 0 15px var(--azul-neon); margin: 15px 0;">???</div>
      </div>
    </div>

    <button onclick="fazerLogout()" style="color:#64748b; background:none; border:none; margin-top:25px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px;">Desconectar do Portal</button>
  </div>
<script>
const URL_SISTEMA_CHAVAS = "https://script.google.com/macros/s/AKfycbydCvg69SCrNMgApSqjK7gVXXx_dXj2hPjnzXzK1Epo4FT9URZaiE6fPcoYR9qfd9ty/exec";
let loopMonitoramento = null;
let informacoesJogadorLogado = null;
let timesMapeadosPorTreinador = {};
let confrontosAtivos = [];

// --- FORMATADOR ISOLADO: Cria o botão de Lista sem misturar HTML na lógica ---
function formatarColunaTimeComLink(textoTime) {
  if (!textoTime || textoTime.trim() === "" || textoTime.trim() === "Aguardando..." || textoTime.trim() === "BYE") return "";
  var textoLimpo = textoTime.toString().trim();
  if (textoLimpo.startsWith("http://") || textoLimpo.startsWith("https://") || textoLimpo.includes("pokepaste") || textoLimpo.includes("showdown")) {
    return `<a href="${textoLimpo}" target="_blank" rel="noopener noreferrer" style="display: inline-block; background: linear-gradient(to bottom, #00bfff, #0a2e5c); color: white; text-decoration: none; padding: 3px 6px; font-size: 0.6rem; font-weight: bold; border-radius: 3px; text-transform: uppercase; border: 1px solid #00bfff; margin-left: 6px; cursor: pointer;">📋 Lista</a>`;
  }
  return "";
}

window.onload = () => {
  const sessaoSalva = localStorage.getItem('SessionTournament');
  if (sessaoSalva) {
    try {
      informacoesJogadorLogado = JSON.parse(sessaoSalva);
      liberarAmbientePrincipal(informacoesJogadorLogado);
    } catch(e) { localStorage.removeItem('SessionTournament'); }
  }
};

function trocarAbaVisual(idAbaAlvo) {
  document.querySelectorAll('.tab-content').forEach(aba => aba.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  const abaAtiva = document.getElementById(idAbaAlvo);
  if (abaAtiva) abaAtiva.classList.remove('hidden');
  if(idAbaAlvo === 'aba-chaveamento') document.getElementById('btn-aba-chaves').classList.add('active');
  if(idAbaAlvo === 'aba-premios') document.getElementById('btn-aba-premios').classList.add('active');
}

async function registrarInscricao(tipoAtividade) {
  const nome = document.getElementById('nome').value.trim();
  const senha = document.getElementById('senha').value;
  const timeDigitado = document.getElementById('deck-torneio') ? document.getElementById('deck-torneio').value.trim() : "";
  const statusElement = document.getElementById('status-login');

  if (!nome || !senha) { alert("Preencha o Nome e a Senha!"); return; }
  if (statusElement) statusElement.innerText = "Sincronizando com o Portal da Liga...";

  try {
    const resposta = await fetch(URL_SISTEMA_CHAVAS, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: "registrarParticipacao", nome: nome, senha: senha, deck: timeDigitado, escopo: tipoAtividade })
    });
    const dadosServidor = await resposta.json();
    if (dadosServidor.status === "Sucesso" || dadosServidor.status === "LoginEfetuado") {
      informacoesJogadorLogado = { nome, senha };
      localStorage.setItem('SessionTournament', JSON.stringify(informacoesJogadorLogado));
      if (statusElement) statusElement.innerText = "Acesso validado!";
      setTimeout(() => {
        liberarAmbientePrincipal(informacoesJogadorLogado);
        if(document.getElementById('deck-torneio')) document.getElementById('deck-torneio').value = "";
      }, 1000);
    } else {
      if (statusElement) statusElement.innerText = dadosServidor.mensagem || "Falha nas credenciais.";
    }
  } catch (erro) { if (statusElement) statusElement.innerText = "Erro na validação de rede."; }
}
function liberarAmbientePrincipal(dadosUsuario) {
  if(!dadosUsuario || !dadosUsuario.nome) return;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
  document.getElementById('user-display').innerText = dadosUsuario.nome;
  const nomeMinusculo = dadosUsuario.nome.toLowerCase();
  if (nomeMinusculo === "sainths" || nomeMinusculo === "pokemaners") {
    document.getElementById('painel-admin').classList.remove('hidden');
  }
  sincronizarDadosGeraisTorneio();
  if (loopMonitoramento) clearInterval(loopMonitoramento);
  loopMonitoramento = setInterval(sincronizarDadosGeraisTorneio, 8000);
}

async function sincronizarDadosGeraisTorneio() {
  try {
    const resposta = await fetch(`${URL_SISTEMA_CHAVAS}?action=obterStatusGeral`);
    const payload = await resposta.json();
    if (document.getElementById('display-brinde-alvo')) document.getElementById('display-brinde-alvo').innerText = payload.itemSorteio || "Aguardando...";
    if (document.getElementById('display-ganhador-sorteio')) document.getElementById('display-ganhador-sorteio').innerText = payload.ganhadorSorteio || "???";
    
    if (payload.listaInscritosComTimes) {
      timesMapeadosPorTreinador = {};
      payload.listaInscritosComTimes.forEach(inf => {
        if (inf.nome) {
          var partesNick = inf.nome.toString().split(",");
          var nickPuro = partesNick[0] ? partesNick[0].trim().toLowerCase() : "";
          timesMapeadosPorTreinador[nickPuro] = inf.time || "";
        }
      });
    }
    if (payload.chavesNuvem && payload.chavesNuvem.length > 0) {
      confrontosAtivos = payload.chavesNuvem;
      renderizarArvoreMataMataLocal();
    } else {
      confrontosAtivos = [];
      const container = document.getElementById('container-fases-arvore');
      if (container) container.innerHTML = `<p style="color:#64748b; font-size:0.8rem; padding: 20px;">Aguardando chaves oficiais...</p>`;
    }
  } catch (e) { console.warn("Aviso na sincronização."); }
}

async function gerarChaveamentoLocal() {
  if (confirm("Deseja fechar as inscrições e gerar as chaves oficiais na nuvem?")) {
    try {
      const resp = await fetch(`${URL_SISTEMA_CHAVAS}?action=obterListaInscritosReais`);
      const payloadInscritos = await resp.json();
      if (!payloadInscritos || !payloadInscritos.lista || payloadInscritos.lista.length === 0) {
        alert("Nenhum competidor cadastrado na planilha ainda!"); return;
      }
      
      let listaRaw = Array.isArray(payloadInscritos.lista) ? payloadInscritos.lista : [payloadInscritos.lista];
      let lista = listaRaw.map(linha => {
        if(!linha) return "";
        var partesLinha = linha.toString().split(",");
        return partesLinha[0] ? partesLinha[0].trim() : "";
      }).filter(nome => nome !== "" && nome.toLowerCase() !== "nome");

      if (lista.length < 2) { alert("Quantidade de competidores insuficiente!"); return; }

      for (let i = lista.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        let temp = lista[i]; lista[i] = lista[j]; lista[j] = temp;
      }

      let n = lista.length; let potencia = 2;
      while (potencia < n) potencia *= 2;
      let byesCount = potencia - n; let reaisCount = n - byesCount; let partidasCount = reaisCount / 2;
      let jogamR1 = lista.slice(0, reaisCount); let ganhamBye = lista.slice(reaisCount);

      confrontosAtivos = [];
      let nomeFase1 = "Rodada Inicial";
      if (potencia === 32) nomeFase1 = "Preliminar (Chave de 32)";
      else if (potencia === 16) nomeFase1 = "Oitavas de Final";
      else if (potencia === 8) nomeFase1 = "Quartas de Final";

      for (let m = 0; m < partidasCount; m++) {
        confrontosAtivos.push({ id: "F1-M" + (m + 1), fase: nomeFase1, j1: jogamR1[m * 2], j2: jogamR1[(m * 2) + 1], vencedor: "" });
      }
      for (let b = 0; b < ganhamBye.length; b++) {
        confrontosAtivos.push({ id: "F1-B" + (b + 1), fase: nomeFase1, j1: ganhamBye[b], j2: "BYE", vencedor: ganhamBye[b] });
      }

      let vagasFaseSeguinte = potencia / 2; let numeroFaseContador = 2;
      while (vagasFaseSeguinte >= 1) {
        let nomeFaseLabel = "Fase " + numeroFaseContador;
        if (vagasFaseSeguinte === 16) nomeFaseLabel = "Oitavas de Final";
        if (vagasFaseSeguinte === 8) nomeFaseLabel = "Quartas de Final";
        if (vagasFaseSeguinte === 4) nomeFaseLabel = "Quartas de Final";
        if (vagasFaseSeguinte === 2) nomeFaseLabel = "Semifinal";
        if (vagasFaseSeguinte === 1) nomeFaseLabel = "Grande Final";

        for (let x = 0; x < vagasFaseSeguinte; x++) {
          confrontosAtivos.push({ id: "F" + numeroFaseContador + "-M" + (x + 1), fase: nomeFaseLabel, j1: "Aguardando...", j2: "Aguardando...", vencedor: "" });
        }
        vagasFaseSeguinte = vagasFaseSeguinte / 2; numeroFaseContador++;
      }

      ganhamBye.forEach((jogador, b) => {
        let fakeId = "F1-B" + (b + 1);
        avançarJogadorNaArvoreLocal(fakeId, jogador);
      });
      await enviarChavesParaNuvem();
    } catch(err) { alert("Erro ao gerar chaveamento."); }
  }
}
function avançarJogadorNaArvoreLocal(idDuelo, nomeVencedor) {
  if (!idDuelo || !nomeVencedor) return;
  var numeros = idDuelo.match(/\d+/g);
  if (!numeros || numeros.length < 2) return;

  var faseAtual = parseInt(numeros[0]);
  var numeroMatch = parseInt(numeros[1]);
  if (isNaN(faseAtual) || isNaN(numeroMatch)) return;

  var proximaFase = faseAtual + 1;
  var proximoMatchIndex = Math.ceil(numeroMatch / 2);
  var ehSlot1 = (numeroMatch % 2 !== 0);
  var idAlvo = "F" + proximaFase + "-M" + proximoMatchIndex;
  
  var partesNome = nomeVencedor.toString().split(",");
  var nomeLimpoFiltrado = partesNome ? partesNome[0].trim() : "";

  confrontosAtivos.forEach(match => {
    if (match.id && match.id.toString().trim() === idAlvo) {
      if (ehSlot1) { match.j1 = nomeLimpoFiltrado; } 
      else { match.j2 = nomeLimpoFiltrado; }
      
      if (match.j1 === "BYE" || match.j2 === "BYE") {
        var proxVencedor = match.j1 === "BYE" ? match.j2 : match.j1;
        if (proxVencedor !== "Aguardando...") {
          match.vencedor = proxVencedor;
          avançarJogadorNaArvoreLocal(idAlvo, proxVencedor);
        }
      }
    }
  });
}

async function reportarVitoriaDireta(idDuelo, nomeVencedor) {
  if (!idDuelo || !nomeVencedor) return;
  if (confirm("Confirma seu reporte de vitória no Set para " + nomeVencedor + "?")) {
    confrontosAtivos.forEach(match => {
      if (match.id === idDuelo) {
        match.vencedor = nomeVencedor;
        avançarJogadorNaArvoreLocal(idDuelo, nomeVencedor);
      }
    });
    await enviarChavesParaNuvem();
  }
}

async function enviarChavesParaNuvem() {
  renderizarArvoreMataMataLocal();
  await fetch(URL_SISTEMA_CHAVAS, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: "salvarChavesNuvem", estrutura: JSON.stringify(confrontosAtivos) })
  });
}

function renderizarArvoreMataMataLocal() {
  var container = document.getElementById('container-fases-arvore');
  if (!container) return;
  container.innerHTML = "";

  if (!confrontosAtivos || confrontosAtivos.length === 0) {
    container.innerHTML = `<p style="color:#64748b; font-size:0.8rem; padding: 20px;">Aguardando chaves oficiais...</p>`; return;
  }

  var nomeCampeaoSupremo = "";
  var ultimoMatch = confrontosAtivos[confrontosAtivos.length - 1];
  if (ultimoMatch && ultimoMatch.fase === "Grande Final" && ultimoMatch.vencedor) {
    nomeCampeaoSupremo = ultimoMatch.vencedor;
  }

  var html = "";
  if (nomeCampeaoSupremo !== "" && nomeCampeaoSupremo !== "BYE") {
    html += `<div style="text-align: center;"><div class="urna-box" style="border: 2px solid var(--amarelo-campeao); background: rgba(255, 222, 0, 0.05); margin-bottom: 30px; animation: pulse 2s infinite;"><div style="font-size: 1.8rem;">👑🏆👑</div><div style="font-size: 0.85rem; color: var(--amarelo-campeao); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px;">Grande Campeão da Liga</div><div style="font-size: 2rem; color: #fff; font-weight: 900; text-shadow: 0 0 20px var(--amarelo-campeao); margin: 10px 0;">${nomeCampeaoSupremo}</div></div></div>`;
  }

  var agrupamento = {};
  confrontosAtivos.forEach(m => {
    if (m && m.fase) {
      if (!agrupamento[m.fase]) agrupamento[m.fase] = [];
      agrupamento[m.fase].push(m);
    }
  });

  for (var fase in agrupamento) {
    var contemPartidaValida = agrupamento[fase].some(m => m.j1 !== "BYE" && m.j2 !== "BYE");
    if (!contemPartidaValida) continue;

    html += `<div class="fase-secao"><div class="fase-header">${fase}</div>`;
    agrupamento[fase].forEach(match => {
      if (match.j1 === "BYE" || match.j2 === "BYE") return;

      var isW1 = match.vencedor && match.vencedor === match.j1;
      var isW2 = match.vencedor && match.vencedor === match.j2;
      var nomeLogadoMinusculo = informacoesJogadorLogado ? informacoesJogadorLogado.nome.toLowerCase() : "";
      var ehJuiz = nomeLogadoMinusculo === "sainths" || nomeLogadoMinusculo === "pokemaners";
      var eDono1 = informacoesJogadorLogado && informacoesJogadorLogado.nome === match.j1;
      var eDono2 = informacoesJogadorLogado && informacoesJogadorLogado.nome === match.j2;
      var pronto = match.j1 !== "Aguardando..." && match.j2 !== "Aguardando...";

      var partesJ1 = match.j1.toString().split(",");
      var j1Puro = partesJ1 ? partesJ1[0].trim() : "";
      var partesJ2 = match.j2.toString().split(",");
      var j2Puro = partesJ2 ? partesJ2[0].trim() : "";

      var t1 = timesMapeadosPorTreinador[j1Puro.toLowerCase()] || "";
      var t2 = timesMapeadosPorTreinador[j2Puro.toLowerCase()] || "";

      html += `
        <div class="card-duelo" style="margin-bottom: 15px;">
          <div class="duelistas-nomes" style="flex: 1;">
            <div class="linha-treinador ${isW1 ? 'winner' : ''}">
              <span style="display: flex; align-items: center;">🏃 ${j1Puro} ${isW1 ? '🏆' : ''} ${formatarColunaTimeComLink(t1)}</span>
              ${(pronto && (ehJuiz || (eDono1 && !match.vencedor))) ? `<button onclick="reportarVitoriaDireta('${match.id}', '${j1Puro}')" class="btn-vitoria">Venceu</button>` : ""}
            </div>
            <div class="linha-treinador ${isW2 ? 'winner' : ''}">
              <span style="display: flex; align-items: center;">🏃 ${j2Puro} ${isW2 ? '🏆' : ''} ${formatarColunaTimeComLink(t2)}</span>
              ${(pronto && (ehJuiz || (eDono2 && !match.vencedor))) ? `<button onclick="reportarVitoriaDireta('${match.id}', '${j2Puro}')" class="btn-vitoria">Venceu</button>` : ""}
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;
}

async function publicarPremioSemSortear() {
  var itemInput = document.getElementById('input-nome-premio').value.trim();
  if (!itemInput) return;
  await fetch(URL_SISTEMA_CHAVAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "anunciarBrindeFase", item: itemInput }) });
  alert("Prêmio anunciado!");
}
async function dispararSorteioBrinde() {
  var itemInput = document.getElementById('input-nome-premio').value.trim();
  await fetch(URL_SISTEMA_CHAVAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "sortearBrindeNaUrna", item: itemInput }) });
  document.getElementById('input-nome-premio').value = "";
}

}

}
